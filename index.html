<!doctype html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
    <meta content="dark light" name="color-scheme"/>
    <title>Student Picker</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230369a1'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M16 7l2 6.2 6.5 2.8-6.5 2.8L16 25l-2-6.2L7.5 16l6.5-2.8Z' fill='white'/%3E%3C/svg%3E"/>
    <script>try{document.documentElement.dataset.theme=localStorage.getItem("student-picker:theme")==="light"?"light":"dark"}catch(e){}</script>
    <link href="/src/styles.css" rel="stylesheet"/>
</head>
<body>
<div id="app">
    <header id="header">
        <div class="brand">
            <span class="brand-mark">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l1.8 5.4a2 2 0 0 0 1.3 1.3L20.5 11.5l-5.4 1.8a2 2 0 0 0-1.3 1.3L12 20l-1.8-5.4a2 2 0 0 0-1.3-1.3L3.5 11.5l5.4-1.8a2 2 0 0 0 1.3-1.3Z"/></svg>
            </span>
            <span class="brand-text">
                <span class="brand-name" id="brandName">Student Picker</span>
                <span class="brand-sub" id="brandTagline">Fair turns for every student</span>
            </span>
        </div>
        <div id="controlsPanel" class="header-actions"></div>
    </header>
    <main id="mainTag">
        <section id="classesPanel" class="panel" aria-label="Classes"></section>
        <section id="mainPanel" class="panel stage" aria-label="Picker"></section>
        <section id="studentsPanel" class="panel" aria-label="Students"></section>
    </main>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/src/main.ts" type="module"></script>
</body>
</html>
