<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herkese Eşit Söz</title>
<!-- Bold Signal preset (ECC frontend-slides): Archivo Black + Space Grotesk -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* ===========================================
   THEME: change these to restyle the whole deck
   Sizes scale with both width and height so text stays
   readable from the back of a classroom (~10 m) on a 1080p board.
   =========================================== */
:root {
  --bg: #161616;
  --bg-2: #222222;
  --ink: #f5f2ec;
  --ink-2: #a9a59e;
  --accent: #ff6a2b;        /* hot orange focal colour */
  --accent-ink: #161616;    /* text on orange */
  --muted-bar: #5b5852;

  --font-display: "Archivo Black", "Arial Black", sans-serif;
  --font-body: "Space Grotesk", "Segoe UI", sans-serif;

  --title-size: clamp(2.2rem, min(6.6vw, 12vh), 8rem);
  --h2-size:    clamp(1.8rem, min(4.8vw, 8.6vh), 6rem);
  --h3-size:    clamp(1.2rem, min(2.8vw, 5vh), 3.4rem);
  --body-size:  clamp(1.05rem, min(2.5vw, 4.5vh), 3.1rem);
  --label-size: clamp(0.95rem, min(1.9vw, 3.4vh), 2.4rem);
  --kicker-size:clamp(0.85rem, min(1.6vw, 2.9vh), 2rem);
  --num-size:   clamp(5rem, min(20vw, 34vh), 26rem);

  --slide-padding: clamp(1rem, 5vw, 7rem);
  --content-gap: clamp(0.75rem, 2.4vh, 2.5rem);

  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --duration: 0.7s;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

/* ===== VIEWPORT FITTING: MANDATORY BASE (ECC) ===== */
html, body { height: 100%; overflow-x: hidden; }
html { scroll-snap-type: y mandatory; scroll-behavior: smooth; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); }
.slide {
  width: 100vw; height: 100vh; height: 100dvh; overflow: hidden;
  scroll-snap-align: start; display: flex; flex-direction: column; position: relative;
  background: var(--bg);
}
.slide-content {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  gap: var(--content-gap); max-height: 100%; overflow: hidden;
  padding: var(--slide-padding); position: relative; z-index: 1;
}
img { max-width: 100%; object-fit: contain; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
  html { scroll-behavior: auto; }
}

/* ===== TYPE ===== */
.kicker { font-size: var(--kicker-size); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
h1, h2 { font-family: var(--font-display); font-weight: 400; line-height: 1.02; letter-spacing: -0.01em; }
h1 { font-size: var(--title-size); }
h2 { font-size: var(--h2-size); max-width: 18ch; }
h3 { font-family: var(--font-body); font-weight: 700; font-size: var(--h3-size); line-height: 1.12; }
.lead { font-size: var(--body-size); line-height: 1.3; color: var(--ink-2); max-width: 30ch; }
.lead b, .lead strong { color: var(--ink); }
.small { font-size: clamp(0.7rem, 1.1vw, 1.3rem); color: var(--ink-2); line-height: 1.45; }

/* Oversized section number: Bold Signal signature */
.num {
  position: absolute; right: calc(-1 * clamp(0.5rem, 1vw, 1.5rem)); bottom: calc(-1 * clamp(1rem, 4vh, 4rem));
  font-family: var(--font-display); font-size: var(--num-size); line-height: 1;
  color: transparent; -webkit-text-stroke: 2px #3a3835; z-index: 0; user-select: none;
}

/* ===== BUILDING BLOCKS ===== */
.focal { background: var(--accent); color: var(--accent-ink); border-radius: clamp(8px, 1vw, 18px); padding: clamp(1rem, 3vh, 3rem) clamp(1.2rem, 2.4vw, 3rem); }
.focal .lead, .focal .small { color: var(--accent-ink); }
.card { background: var(--bg-2); border-radius: clamp(8px, 1vw, 18px); padding: clamp(1rem, 3vh, 2.6rem) clamp(1rem, 2vw, 2.6rem); display: flex; flex-direction: column; gap: clamp(0.4rem, 1.4vh, 1.2rem); }
.card .cite { font-size: var(--label-size); color: var(--accent); font-weight: 700; margin-top: auto; }
.row { display: flex; gap: clamp(0.75rem, 2vw, 2.5rem); }
.row > * { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(0.6rem, 1.6vw, 2rem); }
.step-n { font-family: var(--font-display); font-size: var(--h2-size); color: var(--accent); line-height: 1; }
.split { display: grid; grid-template-columns: 1.35fr 1fr; gap: clamp(1rem, 4vw, 5rem); align-items: center; height: 100%; }
.shot { width: 100%; max-height: 78vh; border-radius: clamp(8px, 1vw, 16px); box-shadow: 0 0 0 3px var(--accent), 0 20px 60px rgba(0,0,0,.5); background: #fff; }
.statement { background: var(--accent); }
.statement h2, .statement .kicker, .statement .lead { color: var(--accent-ink); }
.statement h2 { max-width: 16ch; font-size: var(--title-size); }

/* Classroom dots (slide 2): 30 students, a few raising hands */
.dots { display: grid; grid-template-columns: repeat(6, 1fr); gap: clamp(0.6rem, 2.2vh, 2rem); width: min(42vw, 62vh); }
.dots i { aspect-ratio: 1; border-radius: 50%; background: #3a3835; display: block; }
.dots i.up { background: var(--accent); transform: translateY(-30%); box-shadow: 0 0 0 4px rgba(255,106,43,.25); }

/* Bar charts (slide 15) */
.chart { display: flex; flex-direction: column; gap: clamp(0.4rem, 1.6vh, 1.3rem); }
.bar-row { display: grid; grid-template-columns: 9.5em 1fr 2.2em; align-items: center; gap: 0.6em; font-size: var(--label-size); }
.bar-row .lbl { color: var(--ink-2); }
.bar-row.me .lbl { color: var(--ink); font-weight: 700; }
.track { height: 1.35em; display: flex; }
.seg { height: 100%; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--bg); font-size: 0.8em; }
.seg.zero { background: var(--ink-2); }
.seg.one { background: var(--muted-bar); color: var(--ink); }
.seg.solid { background: var(--muted-bar); }
.me .seg { background: var(--accent); }
.val { font-family: var(--font-display); }
.me .val { color: var(--accent); }
.legend { display: flex; gap: 1.2em; font-size: var(--label-size); color: var(--ink-2); }
.legend span::before { content: ""; display: inline-block; width: 0.8em; height: 0.8em; margin-right: 0.35em; vertical-align: -0.05em; background: var(--c); border-radius: 3px; }

/* Big numbers (slide 16) */
.big { font-family: var(--font-display); font-size: clamp(4rem, min(15vw, 26vh), 18rem); line-height: 0.95; }
.big small { font-size: 0.4em; color: var(--ink-2); }

/* ===== REVEAL ANIMATIONS ===== */
.reveal { opacity: 0; transform: translateY(30px); transition: opacity var(--duration) var(--ease-out-expo), transform var(--duration) var(--ease-out-expo); }
.slide.visible .reveal { opacity: 1; transform: none; }
.slide.visible .reveal:nth-child(2) { transition-delay: .08s; }
.slide.visible .reveal:nth-child(3) { transition-delay: .16s; }
.slide.visible .reveal:nth-child(4) { transition-delay: .24s; }
.slide.visible .reveal:nth-child(5) { transition-delay: .32s; }
.grow { transform-origin: left; transform: scaleX(0); transition: transform 1s var(--ease-out-expo) .3s; }
.slide.visible .grow { transform: scaleX(1); }

/* ===== CHROME: progress, counter, notes ===== */
.progress { position: fixed; top: 0; left: 0; height: 5px; background: var(--accent); width: 0; z-index: 20; transition: width .3s; }
.counter { position: fixed; right: 1.2rem; bottom: 0.9rem; font-size: 0.95rem; color: var(--ink-2); z-index: 20; font-variant-numeric: tabular-nums; }
aside.notes { display: none; }
.notes-panel {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 40vh; overflow: auto; z-index: 30;
  background: rgba(10,10,10,.96); border-top: 3px solid var(--accent); padding: 1.2rem 1.6rem;
  font-size: 1.15rem; line-height: 1.55; color: var(--ink); display: none;
}
.notes-panel.open { display: block; }
.hint { position: fixed; left: 1.2rem; bottom: 0.9rem; font-size: 0.85rem; color: #6d6a64; z-index: 20; }

@media (max-width: 760px) {
  .row, .grid2, .split { grid-template-columns: 1fr; flex-direction: column; }
  .split { height: auto; }
  .num { display: none; }
  .card { flex-direction: row; align-items: center; }
  .card .step-n { font-size: var(--h3-size); }
  .shot { max-height: 42vh; }
}
@media (max-height: 600px) { .hint, .num { display: none; } }
/* Landscape phones: keep columns side by side, there is no height to stack them */
@media (max-height: 500px) {
  :root { --slide-padding: clamp(0.6rem, 3vw, 1.5rem); --content-gap: 0.5rem; }
  .row { flex-direction: row; }
  .grid2 { grid-template-columns: 1fr 1fr; }
  .split { grid-template-columns: 1.2fr 1fr; height: 100%; }
  .card { padding: 0.5rem 0.7rem; }
  .shot { max-height: 70vh; }
  .chart { gap: 0.25rem; }
  .bar-row { font-size: 0.75rem; }
  .small { font-size: 0.55rem; }
  .grid2 { gap: 0.4rem; }
}
@media (max-height: 400px) { .lead { font-size: 0.85rem; } h2 { font-size: 1.5rem; } .card .cite { font-size: 0.75rem; } }
</style>
</head>
<body>
<div class="progress" aria-hidden="true"></div>
<main>
%SLIDES%
</main>
<div class="counter" aria-live="polite"></div>
<div class="hint">← → gezin · N notlar · F tam ekran</div>
<div class="notes-panel" role="region" aria-label="Konuşmacı notları"></div>
<script>
/* ===========================================
   SLIDE PRESENTATION CONTROLLER
   keyboard, wheel/touch (native scroll-snap), progress, notes
   =========================================== */
class SlidePresentation {
  constructor() {
    this.slides = [...document.querySelectorAll('.slide')];
    this.i = 0;
    this.bar = document.querySelector('.progress');
    this.counter = document.querySelector('.counter');
    this.panel = document.querySelector('.notes-panel');
    this.observe();
    this.keys();
    this.go(Math.max(0, this.slides.findIndex(s => '#' + s.id === location.hash)), false);
  }
  observe() {
    const io = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        this.i = this.slides.indexOf(e.target);
        this.update();
      }
    }), { threshold: 0.6 });
    this.slides.forEach(s => io.observe(s));
  }
  keys() {
    document.addEventListener('keydown', e => {
      const next = ['ArrowRight', 'ArrowDown', 'PageDown', ' '], prev = ['ArrowLeft', 'ArrowUp', 'PageUp'];
      if (next.includes(e.key)) { e.preventDefault(); this.go(this.step(1)); }
      else if (prev.includes(e.key)) { e.preventDefault(); this.go(this.step(-1)); }
      else if (e.key === 'Home') this.go(0);
      else if (e.key === 'End') this.go(this.slides.length - 1);
      else if (e.key === 'n' || e.key === 'N') this.panel.classList.toggle('open');
      else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    });
  }
  step(dir) {   // next page edge in that direction from where the paper really is, or from where a running glide is heading
    if (this.to != null && performance.now() - this.at < 1000 && Math.abs(this.slides[this.to].getBoundingClientRect().top) > 2) return this.to + dir;
    const tops = this.slides.map(s => s.getBoundingClientRect().top);
    const i = dir > 0 ? tops.findIndex(t => t > 2) : tops.findLastIndex(t => t < -2);
    return i < 0 ? (dir > 0 ? this.slides.length - 1 : 0) : i;
  }
  go(n, smooth = true) {
    n = Math.max(0, Math.min(this.slides.length - 1, n));
    this.to = n; this.at = performance.now();
    this.slides[n].scrollIntoView({ behavior: smooth ? 'smooth' : 'auto' });
    this.i = n; this.update();
  }
  update() {
    const s = this.slides[this.i];
    this.bar.style.width = ((this.i + 1) / this.slides.length * 100) + '%';
    this.counter.textContent = (this.i + 1) + ' / ' + this.slides.length;
    const notes = s.querySelector('aside.notes');
    this.panel.textContent = notes ? notes.textContent.trim() : '';
    history.replaceState(null, '', '#' + s.id);
  }
}
new SlidePresentation();
</script>
</body>
</html>
